name: Deploy to Cloud

on:
  push:
    branches: [ "main", "deployment/cloud" ]

env:
  REGISTRY: ghcr.io
  RAW_IMAGE_PATH: ${{ github.repository }}
  SERVER_IP: ${{ secrets.SERVER_IP }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image_path: ${{ steps.image_path.outputs.image_path }}

    steps:
    - uses: actions/checkout@v3

    - name: Set lowercase image path
      id: image_path
      run: |
        IMAGE_PATH="$(echo "$RAW_IMAGE_PATH" | tr '[:upper:]' '[:lower:]')"
        echo "IMAGE_PATH=$IMAGE_PATH" >> "$GITHUB_ENV"
        echo "image_path=$IMAGE_PATH" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: Prepare image artifacts directory
      run: mkdir -p "deploy-images"

    - name: Build Server (export tar)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.prod
        tags: ghcr.io/${{ steps.image_path.outputs.image_path }}/dfs-server:latest
        outputs: type=docker,dest=deploy-images/dfs-server.tar

    - name: Build Gateway (export tar)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: gateway/Dockerfile
        tags: ghcr.io/${{ steps.image_path.outputs.image_path }}/dfs-gateway:latest
        outputs: type=docker,dest=deploy-images/dfs-gateway.tar

    - name: Build Dashboard (export tar)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: dashboard/Dockerfile.prod
        tags: ghcr.io/${{ steps.image_path.outputs.image_path }}/dfs-dashboard:latest
        outputs: type=docker,dest=deploy-images/dfs-dashboard.tar

    - name: Build Demo Agent (export tar)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.prod
        target: demo-agent
        tags: ghcr.io/${{ steps.image_path.outputs.image_path }}/dfs-demo-agent:latest
        outputs: type=docker,dest=deploy-images/dfs-demo-agent.tar

    - name: Compress image tars
      run: |
        gzip -9 "deploy-images/dfs-server.tar"
        gzip -9 "deploy-images/dfs-gateway.tar"
        gzip -9 "deploy-images/dfs-dashboard.tar"
        gzip -9 "deploy-images/dfs-demo-agent.tar"

    - name: Upload image artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-images
        path: deploy-images/*.tar.gz

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Download image artifacts
      uses: actions/download-artifact@v4
      with:
        name: deploy-images
        path: deploy-images
    
    - name: Copy docker-compose file to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.prod.yml,deploy-images/dfs-server.tar.gz,deploy-images/dfs-gateway.tar.gz,deploy-images/dfs-dashboard.tar.gz,deploy-images/dfs-demo-agent.tar.gz"
        target: "~/DFS-main/"

    - name: SSH and Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -eu
          cd "$HOME/DFS-main"
          echo "user=$(id -un) groups=$(id -nG)"
          docker --version
          
          IMAGE_PATH="${{ needs.build-and-push.outputs.image_path }}"
          if [ -z "$IMAGE_PATH" ]; then
            echo "ERROR: IMAGE_PATH is empty" >&2
            exit 1
          fi

          if ! sudo -n true 2>/dev/null; then
            echo "ERROR: sudo requires a password; configure passwordless sudo or add ubuntu to the docker group." >&2
            exit 1
          fi

          gzip -dc "deploy-images/dfs-server.tar.gz" | sudo -n docker load
          gzip -dc "deploy-images/dfs-gateway.tar.gz" | sudo -n docker load
          gzip -dc "deploy-images/dfs-dashboard.tar.gz" | sudo -n docker load
          gzip -dc "deploy-images/dfs-demo-agent.tar.gz" | sudo -n docker load
          
          export DFS_IMAGE="ghcr.io/${IMAGE_PATH}/dfs-server:latest"
          export GATEWAY_IMAGE="ghcr.io/${IMAGE_PATH}/dfs-gateway:latest"
          export DASHBOARD_IMAGE="ghcr.io/${IMAGE_PATH}/dfs-dashboard:latest"
          export DEMO_AGENT_IMAGE="ghcr.io/${IMAGE_PATH}/dfs-demo-agent:latest"

          NETWORK_NAME="dfs-net"
          VOLUME_NAME="dfs_data"

          sudo -n docker network inspect "$NETWORK_NAME" >/dev/null 2>&1 || sudo -n docker network create "$NETWORK_NAME" >/dev/null
          sudo -n docker volume inspect "$VOLUME_NAME" >/dev/null 2>&1 || sudo -n docker volume create "$VOLUME_NAME" >/dev/null

          rotate_container() {
            name="$1"
            ts="$(date +%s)"
            if sudo -n docker ps -a --format '{{.Names}}' | grep -Fxq "$name"; then
              sudo -n docker stop "$name" >/dev/null 2>&1 || true
              sudo -n docker rename "$name" "${name}-old-${ts}" >/dev/null 2>&1 || true
            fi
          }

          rotate_container "dfs-prod-server"
          rotate_container "dfs-prod-gateway"
          rotate_container "dfs-prod-dashboard"
          rotate_container "dfs-prod-demo-agent"
          rotate_container "dfs-server"
          rotate_container "gateway"
          rotate_container "dashboard"
          rotate_container "demo-agent"

          sudo -n docker run -d \
            --name "dfs-server" \
            --restart "always" \
            --network "$NETWORK_NAME" \
            -p "50051:50051" \
            -v "${VOLUME_NAME}:/data" \
            "$DFS_IMAGE"

          sudo -n docker run -d \
            --name "demo-agent" \
            --restart "always" \
            --network "$NETWORK_NAME" \
            -e "DFS_SERVER_ADDRESS=dfs-server:50051" \
            -v "${VOLUME_NAME}:/data" \
            "$DEMO_AGENT_IMAGE"

          sudo -n docker run -d \
            --name "gateway" \
            --restart "always" \
            --network "$NETWORK_NAME" \
            -p "8000:8000" \
            -e "DFS_SERVER_ADDRESS=dfs-server:50051" \
            -e "DEMO_AGENT_URL=http://demo-agent:5000" \
            "$GATEWAY_IMAGE"

          sudo -n docker run -d \
            --name "dashboard" \
            --restart "always" \
            --network "$NETWORK_NAME" \
            -p "80:80" \
            "$DASHBOARD_IMAGE"

          sudo -n docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo "Health checks:"
          if command -v curl >/dev/null 2>&1; then
            wait_for_url() {
              url="$1"
              label="$2"
              attempts="${3:-30}"
              i=1
              while [ "$i" -le "$attempts" ]; do
                if curl -fsS "$url" >/dev/null 2>&1; then
                  echo "OK: $label ($url)"
                  return 0
                fi
                sleep 1
                i=$((i + 1))
              done
              echo "ERROR: $label did not become ready ($url)" >&2
              return 1
            }

            wait_for_url "http://127.0.0.1:8000/" "gateway" 60
            wait_for_url "http://127.0.0.1/" "dashboard" 60

            if ! curl -fsS -X POST "http://127.0.0.1/api/run/basic" >/dev/null 2>&1; then
              echo "ERROR: scenario basic failed via dashboard proxy" >&2
              curl -sS -X POST "http://127.0.0.1/api/run/basic" || true
              echo "--- dashboard logs (tail 200) ---"
              sudo -n docker logs --tail 200 "dashboard" || true
              echo "--- gateway logs (tail 200) ---"
              sudo -n docker logs --tail 200 "gateway" || true
              echo "--- demo-agent logs (tail 200) ---"
              sudo -n docker logs --tail 200 "demo-agent" || true
              exit 1
            fi
            echo "OK: scenario basic"
          else
            echo "WARN: curl not installed on server; skipping health checks."
          fi
