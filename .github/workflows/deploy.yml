name: Deploy to Cloud

on:
  push:
    branches: [ "main", "deployment/cloud" ]

env:
  REGISTRY: ghcr.io
  RAW_IMAGE_PATH: ${{ github.repository }}
  SERVER_IP: ${{ secrets.SERVER_IP }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_path: ${{ steps.image_path.outputs.image_path }}

    steps:
    - uses: actions/checkout@v3

    - name: Set lowercase image path
      id: image_path
      run: |
        IMAGE_PATH="$(echo "$RAW_IMAGE_PATH" | tr '[:upper:]' '[:lower:]')"
        echo "IMAGE_PATH=$IMAGE_PATH" >> "$GITHUB_ENV"
        echo "image_path=$IMAGE_PATH" >> "$GITHUB_OUTPUT"

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Server
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.prod
        push: true
        tags: ghcr.io/${{ steps.image_path.outputs.image_path }}/dfs-server:latest

    - name: Build and Push Gateway
      uses: docker/build-push-action@v4
      with:
        context: .
        file: gateway/Dockerfile
        push: true
        tags: ghcr.io/${{ steps.image_path.outputs.image_path }}/dfs-gateway:latest

    - name: Build and Push Dashboard
      uses: docker/build-push-action@v4
      with:
        context: .
        file: dashboard/Dockerfile.prod
        build-args: |
          VITE_API_URL=http://${{ env.SERVER_IP }}:8000
          VITE_WS_URL=ws://${{ env.SERVER_IP }}:8000/ws/events
        push: true
        tags: ghcr.io/${{ steps.image_path.outputs.image_path }}/dfs-dashboard:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Copy docker-compose file to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.prod.yml"
        target: "~/DFS-main/"

    - name: SSH and Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd "$HOME/DFS-main"
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          IMAGE_PATH="${{ needs.build-and-push.outputs.image_path }}"
          if [ -z "$IMAGE_PATH" ]; then
            echo "ERROR: IMAGE_PATH is empty" >&2
            exit 1
          fi

          docker pull "ghcr.io/${IMAGE_PATH}/dfs-server:latest"
          docker pull "ghcr.io/${IMAGE_PATH}/dfs-gateway:latest"
          docker pull "ghcr.io/${IMAGE_PATH}/dfs-dashboard:latest"
          
          export DFS_IMAGE="ghcr.io/${IMAGE_PATH}/dfs-server:latest"
          export GATEWAY_IMAGE="ghcr.io/${IMAGE_PATH}/dfs-gateway:latest"
          export DASHBOARD_IMAGE="ghcr.io/${IMAGE_PATH}/dfs-dashboard:latest"
          
          docker compose -f "docker-compose.prod.yml" up -d --force-recreate
